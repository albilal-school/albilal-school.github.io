<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="description" content="Albilal School System - offline student test records">
<title>Albilal School System</title>
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar no-print">
  <button id="menuBtn" class="menu-btn hidden" aria-label="Menu" aria-controls="nav">☰</button>
  <div class="brand"><img id="brandLogo" src="icons/icon-192.png" alt="logo"><div><b id="brandName">Albilal School System</b><small>Test Record · <span class="ur">ٹیسٹ ریکارڈ</span></small></div></div>
  <div class="status"><span id="netStatus" class="pill">…</span><span id="syncStatus" class="pill"></span><div id="umenuWrap" class="umenu hidden"><button id="userBtn" class="userbtn" aria-haspopup="menu" aria-expanded="false" title="Account menu"><span class="uav" id="uAv"></span><span id="whoami" class="who"></span><span id="uRole" class="rbadge"></span><span class="caret">▾</span></button><div id="userMenu" class="userdrop hidden" role="menu"></div></div><button id="hdrLogout" class="hdr-out hidden" title="Log out">🚪 <span>Logout</span></button><button id="bell" class="bell hidden" title="Announcements" aria-label="Announcements">🔔<span id="bellCount" class="nbadge hidden"></span></button></div>
</header>
<nav id="pubNav" class="nav pubnav no-print">
  <button data-view="home" onclick="go('home')">🏠 Home</button>
  <button data-view="teacher" onclick="go('teacher')">👩‍🏫 Teacher Login</button>
  <button data-view="student" onclick="go('student')">🎓 Student Login</button>
  <button data-view="admin" onclick="go('admin')">🛡️ Admin</button>
  <button data-view="lookup" onclick="go('lookup')">👪 Check Result</button>
  <button data-view="contact" onclick="go('contact')">📞 Contact</button>
</nav>
<nav id="nav" class="nav no-print hidden">
  <button data-view="admin" id="navAdmin" data-who="owner" class="nav-key">🛡️ Admin Panel</button>
  <button data-view="home" data-who="teacher owner">🏠 Dashboard</button>
  <button data-view="shome" data-who="student" class="nav-key">🏠 Dashboard</button>
  <button data-view="mystudents" data-who="teacher owner">👥 Class Students</button>
  <button data-view="entry" data-who="teacher owner" class="nav-key">➕ Enter Marks</button>
  <button data-view="tdash" data-who="teacher owner">🏫 My Classes</button>
  <button data-view="mine" data-who="student">📈 My Results</button>
  <button data-view="report" data-who="teacher owner">🗓️ Reports</button>
  <button data-view="tests" data-who="teacher owner">📋 My Tests</button>
  <button data-view="sdash" data-who="teacher owner">🎓 Student Insights</button>
  <button data-view="notes">📚 Notes <span id="notesBadge" class="nbadge hidden"></span></button>
  <button data-view="chat">💬 Chat</button>
  <button data-view="ann">📢 Announcements</button>
  <button data-view="timetable">🕒 Timetable</button>
  <button data-view="honor">🏅 Honor Board</button>
  <button data-view="card">🖨️ Result Card</button>
  <button data-view="settings" data-who="teacher owner">⚙️ Settings</button>
  <button data-view="account" data-who="student">👤 Profile &amp; Settings</button>
  <button data-view="contact">📞 Contact</button>
</nav>
<div id="annBanner" class="no-print"></div>
<main id="app"></main>
<footer class="foot"><div id="footWa" class="no-print"></div>Developed by Toshan Rafiq</footer>
<div id="toast" class="toast no-print"></div>
<div id="modal" class="modal hidden no-print"></div>
<script type="module" src="app.js"></script>
<noscript>Please enable JavaScript.</noscript>
</body>
</html>
